<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ServerTools</title>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- React + ReactDOM -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

<!-- React Router DOM -->
<script crossorigin src="https://unpkg.com/react-router-dom@6/umd/react-router-dom.development.js"></script>

<!-- Babel -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

<div id="root"></div>

<script type="text/babel">

const { HashRouter, Routes, Route, Link } = ReactRouterDOM;

// Navbar
function Navbar() {
  return (
    <nav className="bg-white shadow-md p-4 flex justify-between items-center">
      <h1 className="text-2xl font-bold text-gray-800">ServerTools</h1>
      <div className="space-x-6">
        <Link to="/" className="hover:text-blue-600">Home</Link>
        <Link to="/services" className="hover:text-blue-600">Services</Link>
        <Link to="/requests" className="hover:text-blue-600">Request</Link>
        <Link to="/dashboard" className="hover:text-blue-600">Dashboard</Link>
      </div>
    </nav>
  );
}

// Footer
function Footer() {
  return (
    <footer className="bg-white shadow-inner p-6 text-center text-gray-600 mt-10">
      &copy; 2026 ServerTools. All rights reserved.
    </footer>
  );
}

// Hero Section
function HeroSection() {
  return (
    <div className="text-center py-20 bg-gray-100">
      <h1 className="text-5xl font-bold mb-4">Professional Server Bots & Automation</h1>
      <p className="text-gray-600 mb-8">Reliable free and premium services for your server</p>
      <Link to="/services" className="bg-blue-600 text-white font-semibold px-6 py-3 rounded hover:bg-blue-700 transition">
        View Services
      </Link>
    </div>
  );
}

// Service Card
function ServiceCard({ name, description, price, isRobux }) {
  const handleClick = () => alert(isRobux ? `Redirect to Robux purchase for ${name}` : "Free service accessed!");
  return (
    <div className="bg-white shadow rounded p-6 flex flex-col justify-between hover:shadow-lg transition">
      <div>
        <h2 className="text-xl font-semibold mb-2">{name}</h2>
        <p className="text-gray-600 mb-4">{description}</p>
      </div>
      <div className="flex justify-between items-center">
        <span className="font-semibold">{isRobux ? `${price} Robux` : "Free"}</span>
        <button onClick={handleClick} className={`px-4 py-2 rounded font-semibold ${isRobux ? "bg-blue-600 text-white hover:bg-blue-700" : "bg-gray-300 text-gray-800 hover:bg-gray-400"} transition`}>
          {isRobux ? "Buy with Robux" : "Use Free Service"}
        </button>
      </div>
    </div>
  );
}

// Pages
function Home() {
  return (
    <div>
      <HeroSection />
      <div className="p-8 text-center">
        <h2 className="text-2xl font-semibold mb-4">Why Choose ServerTools?</h2>
        <p className="text-gray-600">
          We provide professional-grade bots and automation services for servers, including both free tools and premium Robux-paid services. Our solutions are easy to implement and reliable.
        </p>
      </div>
    </div>
  );
}

function Services() {
  const services = [
    { name: "Free Welcome Embed", description: "Automatically welcome new members with a message", price: 0, isRobux: false },
    { name: "Advanced Verification Bot", description: "Automate member verification and role assignment", price: 100, isRobux: true },
    { name: "Server Automation Bot", description: "Manage roles, reminders, and reactions efficiently", price: 200, isRobux: true },
  ];

  return (
    <div className="p-8">
      <h1 className="text-3xl font-bold mb-6">Our Services</h1>
      <div className="grid md:grid-cols-3 gap-6">
        {services.map((s, i) => <ServiceCard key={i} {...s} />)}
      </div>
    </div>
  );
}

function Requests() {
  const [name, setName] = React.useState("");
  const [email, setEmail] = React.useState("");
  const [request, setRequest] = React.useState("");

  const handleSubmit = e => {
    e.preventDefault();
    alert(`Request submitted!\nName: ${name}\nEmail: ${email}\nRequest: ${request}`);
    setName(""); setEmail(""); setRequest("");
  };

  return (
    <div className="p-8 max-w-2xl mx-auto">
      <h1 className="text-3xl font-bold mb-6 text-center">Submit a Custom Request</h1>
      <form onSubmit={handleSubmit} className="bg-white p-6 rounded shadow space-y-4">
        <div>
          <label className="block mb-1">Name:</label>
          <input type="text" value={name} onChange={e=>setName(e.target.value)} className="w-full p-2 border rounded" required/>
        </div>
        <div>
          <label className="block mb-1">Email:</label>
          <input type="email" value={email} onChange={e=>setEmail(e.target.value)} className="w-full p-2 border rounded" required/>
        </div>
        <div>
          <label className="block mb-1">Request Details:</label>
          <textarea value={request} onChange={e=>setRequest(e.target.value)} className="w-full p-2 border rounded" rows="5" required/>
        </div>
        <button type="submit" className="bg-blue-600 text-white px-6 py-3 rounded hover:bg-blue-700 transition">Submit Request</button>
      </form>
    </div>
  );
}

function Dashboard() {
  const purchased = [
    { name: "Advanced Verification Bot", status: "Purchased" },
    { name: "Server Automation Bot", status: "Pending" },
  ];

  return (
    <div className="p-8 max-w-3xl mx-auto">
      <h1 className="text-3xl font-bold mb-6 text-center">Your Dashboard</h1>
      {purchased.length===0 ? <p className="text-center text-gray-600">You haven't purchased any services yet.</p> :
      <div className="grid md:grid-cols-2 gap-6">
        {purchased.map((s,i)=>(
          <div key={i} className="bg-white p-6 rounded shadow hover:shadow-lg transition">
            <h2 className="text-xl font-semibold mb-2">{s.name}</h2>
            <p>Status: {s.status}</p>
          </div>
        ))}
      </div>}
    </div>
  );
}

// App
function App() {
  return (
    <HashRouter>
      <Navbar />
      <Routes>
        <Route path="/" element={<Home />} />
        <Route path="/services" element={<Services />} />
        <Route path="/requests" element={<Requests />} />
        <Route path="/dashboard" element={<Dashboard />} />
      </Routes>
      <Footer />
    </HashRouter>
  );
}

// Render
ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>

</body>
</html>
